services:
  db:
    image: postgres:16-alpine
    container_name: crumb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crumb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crumb}
      POSTGRES_DB: ${POSTGRES_DB:-crumb}
    ports:
      - '5432:5432'
    volumes:
      - crumb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crumb} -d ${POSTGRES_DB:-crumb}']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: crumb-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  crumb_pgdata:
